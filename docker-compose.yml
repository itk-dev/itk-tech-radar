networks:
  frontend:
    external: true
  app:
    driver: bridge
    internal: false

services:
  # Astro dev server with hot reload, served by Traefik at
  # http://${COMPOSE_DOMAIN}/itk-tech-radar/ (the site's base path).
  node:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 4321 --allowed-hosts ${COMPOSE_DOMAIN:?}"
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    networks:
      - app
      - frontend
    ports:
      - "4321"
    volumes:
      - ./:/app:delegated
      # Linux node_modules, kept apart from any host install.
      - node_modules:/app/node_modules
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}.rule=Host(`${COMPOSE_DOMAIN:?}`)"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:?}.loadbalancer.server.port=4321"

  # Code checks tools
  markdownlint:
    image: itkdev/markdownlint
    profiles:
      - dev
    volumes:
      - ./:/md

volumes:
  node_modules:
