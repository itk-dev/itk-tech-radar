# Based on config/symfony/yaml/.prettierrc.yaml in https://github.com/itk-dev/devops_itkdev-docker,
# with the Astro plugin and settings for the site's own code.

# https://prettier.io/docs/configuration
plugins:
  - prettier-plugin-astro
singleQuote: true
printWidth: 120

# Later overrides win, so the Taskfile rule comes after the general YAML rule.
overrides:
  # YAML keeps Prettier's default double quotes, like the rest of ITK's YAML.
  - files:
      - "*.{yml,yaml}"
    options:
      singleQuote: false

  # https://taskfile.dev/docs/styleguide
  - files:
      - "Taskfile.{yml,yaml}"
    options:
      tabWidth: 2
      singleQuote: true
