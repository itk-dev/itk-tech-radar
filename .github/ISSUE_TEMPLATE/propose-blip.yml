name: Propose a blip
description: Suggest a new technology for the radar, or a move for an existing blip.
title: "Blip: "
labels: [proposal]
body:
  - type: input
    id: technology
    attributes:
      label: Technology, tool or technique
      description: The name as it should appear on the radar. For an existing blip, use its current name.
    validations:
      required: true
  - type: dropdown
    id: quadrant
    attributes:
      label: Quadrant
      options:
        - Languages & Frameworks
        - Tools
        - Platforms & Infrastructure
        - Techniques
    validations:
      required: true
  - type: dropdown
    id: ring
    attributes:
      label: Suggested ring
      options:
        - Adopt
        - Trial
        - Assess
        - Hold
    validations:
      required: true
  - type: textarea
    id: reasoning
    attributes:
      label: Reasoning
      description: Why this ring? What have we learned from using it, and where does it fit or not fit?
    validations:
      required: true
  - type: textarea
    id: projects
    attributes:
      label: Where we use it
      description: Projects or repositories where it is in use or being tried, if any.
